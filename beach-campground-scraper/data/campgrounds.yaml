campgrounds:
- key: san_elijo
  name: San Elijo State Beach
  park: San Elijo SB
  city: Cardiff-by-the-Sea, Encinitas
  enabled: true
  place_id: '709'
  facility_id: '665'
  park_url: https://www.parks.ca.gov/SanElijo
  map_url: https://www.parks.ca.gov/pages/662/files/SanElijoSB_CampMap.pdf
  notes: '~170 sites on a low bluff directly above the sand, with wooden staircases down to the beach.
    The bluff-edge row has unobstructed water views; the inland row backs onto Old Highway 101 and gets
    road noise. Books out months ahead — cancellations are the realistic way in.

    '
  desirability:
    default: 15
    tiers:
    - score: 100
      label: bluff-front, north section
      sites: 145-171
    - score: 90
      label: ocean side, main section
      sites: 1-43
    - score: 75
      label: ocean side, outer row
      sites: 47,49,51,54,56
    - score: 45
      label: full hookup, inland
      sites: 101-108,111-116
    exclude:
      sites: 94,128
    geo:
      mode: west_percentile
      percentile: 35
      score: 95
      label: oceanfront row (auto-detected from coordinates)
  adjacency:
    mode: either
    max_meters: 35
    groups:
    - 1-43
    - 44-99
    - 101-144
    - 145-171
  facility_ids:
  - '665'
  - '666'
  - '670'
- key: south_carlsbad
  name: South Carlsbad State Beach
  park: South Carlsbad SB
  city: Carlsbad
  enabled: true
  place_id: '720'
  facility_id: '708'
  park_url: https://www.parks.ca.gov/?page_id=660
  map_url: https://www.parks.ca.gov/pages/660/files/SouthCarlsbadSB_CampMap020415.pdf
  notes: ~220 sites in a long linear strip on the bluff, roughly 30 minutes north of downtown San Diego.
    Premium oceanfront sites and inland sites are separated by the park road. More sand at North Ponto
    and South Ponto at either end. Site-number ranges here are NOT hand-verified — the geo rule below
    classifies the oceanfront row from real coordinates instead, which is reliable for a strip campground
    like this one. Run `campscout sites south_carlsbad` to see the true roster and add tiers if you want.
    The live API returns no per-site coordinates (verified 2026-08-12 on the Tyler-hosted backend), so
    the geo rule cannot fire and every site scores the default — meaning ANY open adjacent pair alerts.
    Hand-curate `tiers` by site number from the camp map if you want oceanfront-only alerts.
  desirability:
    default: 85
    geo:
      mode: west_percentile
      percentile: 40
      score: 100
      label: oceanfront row (auto-detected from coordinates)
  adjacency:
    mode: either
    max_meters: 35
  facility_ids:
  - '708'
  - '712'
  - '714'
  - '715'
- key: san_onofre_bluffs
  name: San Onofre State Beach — Bluffs Campground
  park: San Onofre SB
  city: San Clemente (north county line)
  enabled: true
  place_id: '712'
  facility_id: '674'
  park_url: https://www.parks.ca.gov/sanonofre/
  notes: 175 sites strung along old US-101 on the sandstone bluff, with six trails down to the beach.
    No hookups, chemical toilets, cold outdoor showers — more rustic than the state beaches to the south.
    Online reservations run mid-March through mid-September; first-come the rest of the year, when this
    scraper will correctly find nothing. The live API returns no per-site coordinates (verified 2026-08-12
    on the Tyler-hosted backend), so the geo rule cannot fire and every site scores the default — meaning
    ANY open adjacent pair alerts. Hand-curate `tiers` by site number from the camp map if you want oceanfront-only
    alerts.
  desirability:
    default: 85
    geo:
      mode: west_percentile
      percentile: 50
      score: 90
      label: bluff-side (auto-detected from coordinates)
  adjacency:
    mode: either
    max_meters: 40
  facility_ids:
  - '674'
  - '675'
  - '676'
  - '677'
  - '678'
  - '680'
  - '681'
  - '682'
  facility_match: Bluff Camp
- key: san_elijo_group
  name: San Elijo State Beach — Grunion Run group site
  park: San Elijo SB
  city: Cardiff-by-the-Sea, Encinitas
  enabled: false
  place_id: '709'
  facility_id: '2045'
  facility_ids:
  - '2045'
  facility_match: Grunion
